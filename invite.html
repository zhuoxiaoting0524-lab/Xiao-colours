<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邀请注册｜XiaoColour</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=7" />
    <link rel="stylesheet" href="./auth.css?v=1" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <p class="auth-kicker">Invite only</p>
      <h1>创建账户</h1>
      <p class="auth-lead">使用一次性邀请链接注册（7 天内有效）</p>
      <form id="register-form" class="auth-form">
        <label>显示名称 <input name="displayName" type="text" maxlength="80" required /></label>
        <label>邮箱 <input name="email" type="email" autocomplete="username" required /></label>
        <label>密码（至少 10 位） <input name="password" type="password" autocomplete="new-password" required minlength="10" /></label>
        <input name="inviteToken" type="hidden" id="invite-token" />
        <button type="submit">注册并登录</button>
      </form>
      <p id="auth-message" class="auth-message" hidden></p>
      <p class="auth-links"><a href="./login.html">已有账户？登录</a></p>
    </main>
    <script type="module">
      import { api, qs } from "./auth-client.js";
      const token = qs("token") || "";
      document.querySelector("#invite-token").value = token;
      const message = document.querySelector("#auth-message");
      if (!token) {
        message.hidden = false;
        message.textContent = "缺少邀请令牌，请使用完整邀请链接打开本页。";
      }
      document.querySelector("#register-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        message.hidden = true;
        const data = Object.fromEntries(new FormData(event.target).entries());
        try {
          await api("/api/auth/register", { method: "POST", body: data });
          location.href = "./index.html";
        } catch (error) {
          message.hidden = false;
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
