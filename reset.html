<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重置密码｜XiaoColour</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=7" />
    <link rel="stylesheet" href="./auth.css?v=1" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <p class="auth-kicker">Security</p>
      <h1>重置密码</h1>
      <p class="auth-lead">使用管理员发放的一次性重置链接</p>
      <form id="reset-form" class="auth-form">
        <input type="hidden" name="token" id="reset-token" />
        <label>新密码（至少 10 位） <input name="password" type="password" autocomplete="new-password" required minlength="10" /></label>
        <button type="submit">更新密码</button>
      </form>
      <p id="auth-message" class="auth-message" hidden></p>
      <p class="auth-links"><a href="./login.html">返回登录</a></p>
    </main>
    <script type="module">
      import { api, qs } from "./auth-client.js";
      const token = qs("token") || "";
      document.querySelector("#reset-token").value = token;
      const message = document.querySelector("#auth-message");
      document.querySelector("#reset-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = Object.fromEntries(new FormData(event.target).entries());
        try {
          await api("/api/auth/password-reset/confirm", { method: "POST", body });
          message.hidden = false;
          message.textContent = "密码已更新，请重新登录。";
        } catch (error) {
          message.hidden = false;
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
